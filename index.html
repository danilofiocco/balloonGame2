<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Balloon Game 2</title>
  <!-- Fallback for the name box where Arial Rounded MT Bold isn't installed. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap">
  <style>
    :root {
      --bg: #ffffff;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      /* No page scroll, pinch-zoom or text selection while dragging the bow. */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      outline: none;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #222;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }

    /* Name entry after game over, in the ranking board's look: the wooden
       board (img/ranking_board.png, 9-sliced so it fits any height) with the
       star and title on its plank, brown Arial Rounded text on the paper, and
       the cyan button. Covers the game so taps and keys don't reach it. */
    @font-face {
      font-family: 'Supersonic Rocketship';
      src: url('fonts/supersonic_rocketship.ttf') format('truetype');
    }
    #entry {
      --brown: #5b2e0a;
      --rounded: 'Arial Rounded MT Bold', 'Arial Rounded MT', 'Nunito', system-ui, sans-serif;
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      touch-action: auto;
      user-select: auto;
      -webkit-user-select: auto;
    }
    #entry.open { display: flex; }
    #entry form {
      position: relative;
      width: min(100%, 393px);
      box-sizing: border-box;
      /* ranking_board.png at 0.42, 9-sliced: the plank and frame at the top,
         the frame's rounded corners (about 110px in the image) whole in the
         other corners, the paper stretched in between. */
      border-style: solid;
      border-width: 86px 59px 59px;
      border-image: url('img/ranking_board.png') 205 140 140 fill / 86px 59px 59px stretch;
      padding: 18px 0 0;
      color: var(--brown);
      font-family: var(--rounded);
      font-weight: bold;
      text-align: center;
    }
    /* Title on the plank, between its screws: white Supersonic in a brown
       outline, shrunk to fit if it's long (fitTitle). */
    #entry h2 {
      position: absolute;
      top: -44px;
      left: 45px;
      right: 45px;
      margin: 0;
      transform: translateY(-50%);
      color: #fff;
      font: 30px/1 'Supersonic Rocketship', system-ui, sans-serif;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      -webkit-text-stroke: 7px #552f0b;
      paint-order: stroke fill;
    }
    #entry .score {
      margin: 0 0 14px;
      font-size: 56px;
      line-height: 1.1;
    }
    #entry input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border: 3px solid #a6814c;
      border-radius: 16px;
      background: #fbefd5;
      color: var(--brown);
      font: inherit;
      font-size: 26px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }
    /* The hint, smaller so it fits; it clears as soon as the field is tapped. */
    #entry input::placeholder { color: #a6814c; font-size: 19px; }
    #entry input:focus::placeholder { color: transparent; }
    #entry input:focus { border-color: #0360a3; }
    /* SAVE: ranking_button.png with white Supersonic in a navy outline. */
    #entry-save {
      display: block;
      width: 220px;
      height: 80px;
      margin: 16px auto 0;
      padding: 0 0 8px;
      border: 0;
      background: url('img/ranking_button.png') center / 100% 100% no-repeat;
      color: #fff;
      font: 36px/1 'Supersonic Rocketship', system-ui, sans-serif;
      text-transform: uppercase;
      -webkit-text-stroke: 7px #022f67;
      paint-order: stroke fill;
      cursor: pointer;
      transition: transform 0.08s;
    }
    #entry-save:active { transform: scale(0.9); }
    #entry-save:disabled { opacity: 0.6; }
    #entry-skip {
      margin-top: 6px;
      padding: 6px 12px;
      border: 0;
      background: none;
      color: var(--brown);
      font: inherit;
      font-size: 20px;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- The game: build/balloonGame2.riv, signed (rive . --publish) and copied
       next to this page as balloonGame2.riv. Serve the folder over http(s);
       opening the file straight from disk won't load the .riv. -->
  <canvas id="game" tabindex="0"></canvas>
  <div id="error">The game couldn't load.</div>

  <!-- Shown after a game that scored: saves the score under a name, then
       opens the game's ranking panel. -->
  <div id="entry">
    <form autocomplete="off">
      <h2 id="entry-title" data-text="newScore">new score!</h2>
      <div class="score" id="entry-score">0</div>
      <input id="entry-name" maxlength="9" required data-placeholder="yourName" placeholder="type in your name">
      <button type="submit" id="entry-save" data-text="save">save</button>
      <button type="button" id="entry-skip" data-text="skip">skip</button>
    </form>
  </div>

  <!-- Pinned: an unpinned URL picks up new runtimes untested (2.44.0 raised the iPad keyboard
       on every tap). -->
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.43.1/rive.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const RIV_VERSION = '1791555461'; // set by build.sh

    // ---- Leaderboard ------------------------------------------------------
    // Scores live in a Supabase table once these two are filled in (see
    // LEADERBOARD.md); until then, in this browser only (localStorage). The
    // anon key is meant to be public: the table's policies decide what it may do.
    const LEADERBOARD = {
      supabaseUrl: 'https://wkhfpujnynwflcimngjg.supabase.co',
      supabaseKey: 'sb_publishable_KJAWjztbbgQqlC6IYCYS4g_eeuVSd1z', // publishable: safe to be public
      // This game's own table: the project's "scores" table is the original
      // balloonGame's (scored in points), so the two leaderboards stay apart.
      table: 'balloon2_scores',
    };
    const LIST_MAX = 100; // scores the ranking lists
    const NAME_MAX = 9;
    const SCORE_MAX = 1000000; // matches the table's check

    const online = !!(LEADERBOARD.supabaseUrl && LEADERBOARD.supabaseKey);
    const LOCAL_KEY = 'balloonGame2.scores';
    const SEED_KEY = 'balloonGame2.seed';
    const MINE_KEY = 'balloonGame2.mine'; // id of this player's last saved score

    // The ranking starts out with these (made-up) players. Bumping SEED_VERSION
    // wipes a browser's saved scores and starts it over from this list.
    const SEED_VERSION = '2';
    const SEED = [
      ['CICRANO', 60],
      ['FULANO', 40],
      ['ASTOLFO', 20],
    ];

    try {
      if (localStorage.getItem(SEED_KEY) !== SEED_VERSION) {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(SEED.map(([name, score], i) => ({ id: i + 1, name, score }))));
        localStorage.setItem(SEED_KEY, SEED_VERSION);
      }
    } catch (e) {}

    function readLocal() {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch (e) { return []; }
    }
    function writeLocal(rows) {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(rows)); } catch (e) {}
    }
    const byScore = (a, b) => b.score - a.score || a.id - b.id;

    function supabase(path, options = {}) {
      return fetch(LEADERBOARD.supabaseUrl + '/rest/v1/' + path, {
        ...options,
        headers: {
          apikey: LEADERBOARD.supabaseKey,
          Authorization: 'Bearer ' + LEADERBOARD.supabaseKey,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      }).then((res) => {
        if (!res.ok) throw new Error('leaderboard ' + res.status);
        return res.json();
      });
    }

    // The best scores, best first: [{ id, name, score }].
    function fetchTop() {
      if (!online) return Promise.resolve(readLocal().sort(byScore).slice(0, LIST_MAX));
      return supabase(LEADERBOARD.table + '?select=id,name,score&order=score.desc,id.asc&limit=' + LIST_MAX);
    }

    // Saves a score; resolves to its id, so its row can be highlighted.
    function submitScore(name, score) {
      if (!online) {
        const rows = readLocal();
        const id = Date.now();
        rows.push({ id, name, score });
        writeLocal(rows.sort(byScore).slice(0, LIST_MAX * 2));
        return Promise.resolve(id);
      }
      return supabase(LEADERBOARD.table, {
        method: 'POST',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify({ name, score }),
      }).then((rows) => rows[0].id);
    }

    // The page's words (the game is English only).
    const WORDS = { newScore: 'new score!', yourName: 'type in your name', save: 'save', skip: 'skip',
      loading: 'loading...', offline: 'ranking unavailable' };
    document.querySelectorAll('[data-text]').forEach((el) => { el.textContent = WORDS[el.dataset.text]; });
    document.querySelectorAll('[data-placeholder]').forEach((el) => { el.placeholder = WORDS[el.dataset.placeholder]; });

    // ---- Play statistics ---------------------------------------------------
    // The game keeps its numbers for the game in progress in the "telemetry"
    // string (JSON); each game is a session. We send three kinds of event to
    // the balloon2_events table for the stats page (stats/index.html): start,
    // boss (one per boss defeated) and end (game over, or the player quit or
    // left; a later one for the same session replaces it). Not from localhost
    // (add ?track to a local URL to send anyway).
    const VERSION = '2.2.0';
    const EVENTS = 'balloon2_events';
    const tracking = online && (!/^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || /[?&]track\b/.test(location.search));

    function sendEvent(session, kind, data) {
      if (!tracking) return;
      fetch(LEADERBOARD.supabaseUrl + '/rest/v1/' + EVENTS, {
        method: 'POST',
        keepalive: true, // still goes out while the page is closing
        headers: {
          apikey: LEADERBOARD.supabaseKey,
          Authorization: 'Bearer ' + LEADERBOARD.supabaseKey,
          'Content-Type': 'application/json',
          Prefer: 'return=minimal',
        },
        body: JSON.stringify({ session, kind, data, version: VERSION }),
      }).catch(() => {});
    }

    function setupTelemetry(vm) {
      const prop = vm.string('telemetry');
      if (!prop) return;
      let cur = null; // { game, id, bosses sent, snap, ended }
      const endWith = (reason) => {
        if (cur && cur.snap) sendEvent(cur.id, 'end', { ...cur.snap, reason });
      };
      const read = () => {
        let snap;
        try { snap = JSON.parse(prop.value); } catch (e) { return; }
        if (!cur || snap.game !== cur.game) {
          if (cur && !cur.ended) endWith('quit'); // restarted before game over
          cur = { game: snap.game, id: crypto.randomUUID(), bosses: 0, snap: null, ended: false };
          sendEvent(cur.id, 'start', {});
        }
        cur.snap = snap;
        for (; cur.bosses < snap.bosses.length; cur.bosses++) {
          sendEvent(cur.id, 'boss', { ...snap.bosses[cur.bosses], cheated: snap.cheated });
        }
        if (snap.over && !cur.ended) {
          cur.ended = true;
          endWith('gameover');
        }
      };
      prop.on(read);
      read();
      // Leaving (or hiding the page, the last chance on phones): the game so far.
      const leave = () => { if (cur && !cur.ended) endWith('left'); };
      addEventListener('pagehide', leave);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') leave(); });
    }

    function setupLeaderboard(vm) {
      const status = vm.string('rankingStatus');
      const highlight = vm.number('rankHighlight');
      const openRanking = vm.trigger('openRanking');

      // This player's own entry (their last saved score): highlighted in the
      // list, which opens scrolled to it.
      let mine = null;
      try { mine = JSON.parse(localStorage.getItem(MINE_KEY)); } catch (e) {}

      // Fills the game's ranking list, one "NAME<tab>SCORE" line per score.
      function show(rows) {
        vm.string('rankingData').value = rows
          .map((row) => String(row.name).replace(/[\t\n]/g, ' ').toUpperCase() + '\t' + row.score)
          .join('\n');
        const at = rows.findIndex((row) => row.id === mine);
        highlight.value = at >= 0 ? at + 1 : 0;
        status.value = '';
      }
      // The mouse wheel scrolls the ranking (the game can't see wheel events):
      // passed on in artboard pixels.
      const wheel = vm.number('rankingWheel');
      canvas.addEventListener('wheel', (e) => {
        const perPixel = Math.max(1080 / canvas.clientWidth, 2100 / canvas.clientHeight);
        const lines = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? canvas.clientHeight : 1;
        wheel.value += e.deltaY * lines * perPixel;
        e.preventDefault();
      }, { passive: false });

      let loaded = false;
      function refresh() {
        if (!loaded) status.value = WORDS.loading;
        return fetchTop()
          .then((rows) => { loaded = true; show(rows); })
          .catch((e) => { console.error(e); if (!loaded) status.value = WORDS.offline; });
      }
      refresh();

      // Name entry, after a game that scored.
      const entry = document.getElementById('entry');
      const form = entry.querySelector('form');
      const input = document.getElementById('entry-name');
      const save = document.getElementById('entry-save');
      let pending = 0;

      // Shrinks the plank's title until it fits between the screws.
      const title = document.getElementById('entry-title');
      function fitTitle() {
        let size = 30;
        title.style.fontSize = size + 'px';
        while (title.scrollWidth > title.clientWidth && size > 14) {
          size -= 1;
          title.style.fontSize = size + 'px';
        }
      }
      document.fonts.ready.then(() => { if (entry.classList.contains('open')) fitTitle(); });

      function close() {
        entry.classList.remove('open');
        canvas.focus();
      }
      // Keys typed into the box stay out of the game (R would restart it).
      entry.addEventListener('keydown', (e) => e.stopPropagation());
      document.getElementById('entry-skip').addEventListener('click', () => {
        close();
        refresh();
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = input.value.trim().slice(0, NAME_MAX);
        if (!name) return;
        save.disabled = true;
        submitScore(name, pending)
          .then((id) => {
            mine = id;
            try { localStorage.setItem(MINE_KEY, JSON.stringify(id)); } catch (err) {}
            return refresh();
          })
          .then(() => { close(); openRanking.trigger(); })
          .catch((err) => { console.error(err); close(); })
          .finally(() => { save.disabled = false; });
      });

      vm.trigger('gameEnded').on(() => {
        const score = Math.round(vm.number('finalScore').value);
        if (score <= 0 || score > SCORE_MAX) return;
        pending = score;
        document.getElementById('entry-score').textContent = score;
        input.value = '';
        // At once, over the game-over screen springing in, so a tap can't
        // start a new game before the score is saved or skipped.
        entry.classList.add('open');
        fitTitle();
      });
    }

    const r = new rive.Rive({
      // build.sh stamps a new version on every build, so browsers fetch the
      // new file instead of a cached one.
      src: 'balloonGame2.riv?v=' + RIV_VERSION,
      canvas,
      artboard: 'Artboard',
      stateMachines: 'State Machine 1',
      autoplay: true,
      autoBind: true,
      // Lets the file's url event open the portfolio link on the game-over
      // screen (in a new tab).
      automaticallyHandleEvents: true,
      // Portrait 1080x2100 artboard, letterboxed to fit any window.
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => {
        // No text session from the runtime (2.44+): its hidden text field gets focused on every
        // tap (the game script listens for keys), which pops up the iPad/phone keyboard. This page
        // has its own field for names.
        r.wantsTextInputSession = () => false;
        r.resizeDrawingSurfaceToCanvas();
        const vm = r.viewModelInstance;
        if (vm) setupLeaderboard(vm);
        if (vm) setupTelemetry(vm);
        canvas.focus();
      },
      onLoadError: (e) => {
        console.error(e);
        document.getElementById('error').style.display = 'flex';
      },
    });

    // iPhones mute web audio while the ring/silent switch is on silent. Asking
    // for a "playback" session (like a video) makes the game audible anyway:
    // directly where Safari supports it, otherwise by playing a moment of
    // silence through an audio element on the first tap.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    const silence = new Audio('data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');
    silence.loop = true;
    const unlockAudio = () => {
      silence.play().catch(() => {});
      ['touchend', 'click', 'keydown'].forEach((t) => document.removeEventListener(t, unlockAudio, true));
    };
    ['touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, unlockAudio, true));

    // Keep the game's drawing surface (and so its tap positions) matched to the
    // canvas whenever the canvas changes size. On iPhones the browser's bars can
    // still be settling after load, resizing the canvas without a window resize
    // event; missing that squashes the picture and puts taps off target (the
    // leaderboard button stopped responding).
    const fitCanvas = () => r.resizeDrawingSurfaceToCanvas();
    if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', fitCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
    window.addEventListener('pageshow', fitCanvas); // back/forward cache restores

    // Diagnostics, shown only with ?debug in the address: the state of the
    // game's audio engine, plus a plain beep to check the phone plays web audio.
    if (location.search.includes('debug')) {
      const panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;padding:8px;background:rgba(0,0,0,.8);' +
        'color:#0f0;font:12px/1.4 monospace;white-space:pre-wrap;z-index:9;pointer-events:auto';
      const beep = document.createElement('button');
      beep.textContent = 'Test beep';
      beep.style.cssText = 'font:14px system-ui;padding:6px 12px;margin-bottom:6px';
      beep.addEventListener('click', () => {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        log.push('beep: context ' + ctx.state);
      });
      const text = document.createElement('div');
      panel.append(beep, text);
      document.body.append(panel);
      const log = [];
      ['touchend', 'click', 'pointerdown'].forEach((t) =>
        document.addEventListener(t, () => { log.push(t); if (log.length > 6) log.shift(); }, true));
      setInterval(() => {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ma = window.miniaudio;
        const devices = ma && ma.devices ? ma.devices.filter(Boolean) : [];
        const states = devices.map((d) => {
          const ctx = Object.values(d).find((v) => v instanceof Ctx);
          return ctx ? ctx.state + ' @' + ctx.sampleRate : 'no context';
        });
        text.textContent = [
          navigator.userAgent.replace(/^Mozilla\/5.0 /, ''),
          'audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'n/a'),
          'silence element: ' + (silence.paused ? 'paused' : 'playing'),
          'engine: ' + (ma ? devices.length + ' device(s): ' + states.join(', ') : 'not created'),
          'rive volume: ' + r.volume,
          'events: ' + log.join(' '),
        ].join('\n');
      }, 500);
    }
    // Keys (R, Z, L, S) go to the game while the canvas has focus.
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
